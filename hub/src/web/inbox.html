<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox</title>
  <script>(function(){try{var t=localStorage.getItem('hub-theme')||'auto';if(t==='auto')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-bs-theme',t);var l=null;var m=location.search.match(/[?&]lang=(zh|en)\b/);if(m){l=m[1];try{localStorage.setItem('hub-lang',l);}catch(e2){}}else{try{l=localStorage.getItem('hub-lang');}catch(e2){}}document.documentElement.lang=(l==='en')?'en':'zh-CN';}catch(e){}})();</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2324292f'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-size='16' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link href="/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4 data-i18n="title.inbox">收件箱</h4>
    <div id="items"></div>
  </div>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
  <script>
    window.hub.page(t('title.inbox'), 'inbox');
    const H = window.hub;
    const lv = (v) => v === 'HIGH' ? '<span class="badge text-bg-danger">' + t('intl.high') + '</span>'
      : v === 'MEDIUM' ? '<span class="badge text-bg-warning">' + t('intl.medium') + '</span>'
      : '<span class="badge text-bg-secondary">' + t('intl.low') + '</span>';

    function intelBlock(item) {
      const a = item.analyses && item.analyses.length ? item.analyses[0] : null;
      if (!a) return '';
      if (a.status !== 'COMPLETED' || !a.output) {
        return `<div class="mt-2 p-2 border rounded">
          <span class="badge text-bg-secondary">${H.esc(t('intl.analysis'))}</span>
          <span class="badge text-bg-danger">${H.esc(t('intl.failed'))}</span>
          <span class="text-muted small ms-1">${H.esc(t('intl.failedNote'))}: ${H.esc(a.error || '')}</span>
          <details class="small mt-1"><summary>${H.esc(t('intl.viewRaw'))}</summary><pre class="json">${H.esc(JSON.stringify(a, null, 2))}</pre></details>
        </div>`;
      }
      const o = a.output;
      const feedback = a.feedback && a.feedback.length ? a.feedback[a.feedback.length - 1] : null;
      const fbText = feedback ? {
        accepted: t('intl.feedbackDone') + ' · ' + t('intl.accepted'),
        rejected: t('intl.feedbackDone') + ' · ' + t('intl.rejected'),
        partial: t('intl.feedbackDone') + ' · ' + t('intl.modify'),
      }[feedback.verdict] || '' : '';
      const riskBadges = (o.risk_flags || []).map((f) => `<span class="badge text-bg-danger ms-1">${H.esc(t('intl.risk'))}: ${H.esc(f)}</span>`).join('');
      const proj = o.suggested_project && o.suggested_project.project_id ? `<div class="small">${H.esc(t('intl.project'))}: <a href="/project.html?id=${o.suggested_project.project_id}">#${o.suggested_project.project_id}</a>${o.suggested_project.confidence !== null ? ' (' + Math.round(o.suggested_project.confidence * 100) + '%)' : ''}</div>` : '';
      const task = o.suggested_task && o.suggested_task.title ? `<div class="small">${H.esc(t('intl.task'))}: <strong>${H.esc(o.suggested_task.title)}</strong>${o.suggested_task.confidence !== null ? ' (' + Math.round(o.suggested_task.confidence * 100) + '%)' : ''}</div>` : '';
      const action = o.requires_action
        ? '<span class="badge text-bg-primary">' + t('intl.actionYes') + '</span>'
        : '<span class="badge text-bg-secondary">' + t('intl.actionNo') + '</span>';
      const buttons = feedback
        ? `<span class="badge text-bg-success">${H.esc(fbText)}</span>`
        : `<button class="btn btn-sm btn-outline-success" onclick="window.hubInbox.feedback(${a.analysis_id},'accepted')">${H.esc(t('intl.accepted'))}</button>
           <button class="btn btn-sm btn-outline-danger" onclick="window.hubInbox.feedback(${a.analysis_id},'rejected')">${H.esc(t('intl.rejected'))}</button>
           <button class="btn btn-sm btn-outline-secondary" onclick="window.hubInbox.adjust(${a.analysis_id})">${H.esc(t('intl.modify'))}</button>`;
      return `<div class="mt-2 p-2 border rounded bg-opacity-10" style="border-color:var(--bs-border-color)">
        <div class="d-flex flex-wrap align-items-center gap-1">
          <span class="badge text-bg-info">${H.esc(t('intl.analysis'))}</span>
          ${lv(o.importance)} ${lv(o.urgency)} ${action}
          ${o.confidence !== null ? '<span class="text-muted small ms-1">' + H.esc(t('intl.confidence')) + ' ' + Math.round(o.confidence * 100) + '%</span>' : ''}
          ${riskBadges}
          <span class="ms-auto">${buttons}</span>
        </div>
        <div class="small mt-1"><strong>${H.esc(t('intl.summary'))}:</strong> ${H.esc(o.summary)}</div>
        ${proj}${task}
        <details class="small mt-1"><summary>${H.esc(t('intl.viewRaw'))}</summary><pre class="json">${H.esc(JSON.stringify(a, null, 2))}</pre></details>
      </div>`;
    }

    (async () => {
      const el = document.getElementById('items');
      el.innerHTML = H.skeletonList();
      const items = await H.api('GET', '/api/inbox/intelligence');
      if (!items.length) { el.innerHTML = H.emptyHtml('inbox', t('inbox.empty')); return; }
      el.innerHTML = items.map((i) => `
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between">
              <div>
                ${H.badge(i.state)}
                ${i.priority_hint === 'mentioned' ? `<span class="badge b-danger"><i class="dot"></i>${t('inbox.mentioned')}</span>` : ''}
                <strong>${H.esc(i.chat_name || i.source)}</strong>
                <span class="text-muted small">#${i.id}</span>
              </div>
              <div>
                <button class="btn btn-sm btn-outline-secondary" onclick="detail(${i.id})">${t('common.viewContext')}</button>
                <button class="btn btn-sm btn-outline-success" onclick="convert(${i.id})">${t('common.createTask')}</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="act(${i.id},'ignore', this)">${t('common.ignore')}</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="act(${i.id},'archive', this)">${t('common.archive')}</button>
              </div>
            </div>
            ${i.text ? `<div class="text-muted small mt-1">${H.esc(String(i.text).slice(0, 200))}</div>` : ''}
            <div id="detail-${i.id}" class="mt-2 small" style="display:none"></div>
            ${intelBlock(i)}
          </div>
        </div>`).join('');
      const newIds = items.filter((i) => i.state === 'NEW').map((i) => i.id);
      if (newIds.length) {
        H.api('POST', '/api/inbox/read', { ids: newIds })
          .then(() => H.updateNavBadges())
          .catch(() => { });
      }
      window.detail = async (id) => {
        const box = document.getElementById('detail-' + id);
        if (box.style.display !== 'none') { box.style.display = 'none'; return; }
        const d = await H.api('GET', '/api/inbox/' + id);
        box.style.display = 'block';
        box.innerHTML = '<pre class="json">' + d.rawMessages.map((m) => H.esc(JSON.stringify(JSON.parse(m.raw_json), null, 2))).join('\n') + '</pre>';
      };
      window.act = async (id, action, btn) => {
        try {
          await H.withButton(btn, () => H.api('POST', `/api/inbox/${id}/${action}`, {}));
          location.reload();
        } catch (e) { H.formError(e); }
      };
      window.convert = (id) => {
        H.modalPrompt({
          title: t('common.createTask'),
          fields: [{ type: 'text', name: 'title', placeholder: t('inbox.titlePrompt') }],
          okText: t('common.createTask'),
          onOk: async (v) => {
            await H.api('POST', `/api/inbox/${id}/convert`, { title: v.title || null });
            location.reload();
          },
        });
      };
    })().catch(H.formError);

    window.hubInbox = {
      async feedback(analysisId, verdict) {
        try {
          const body = { verdict };
          if (verdict === 'rejected') {
            const a = await H.api('GET', `/api/analyses/${analysisId}`);
            if (a.analysis && a.analysis.output && a.analysis.output.suggested_task && a.analysis.output.suggested_task.title) {
              body.taskSuggestion = 'rejected';
            }
          }
          await H.api('POST', `/api/analyses/${analysisId}/feedback`, body);
          location.reload();
        } catch (e) { H.formError(e); }
      },
      async adjust(analysisId) {
        const projects = await H.api('GET', '/api/projects').catch(() => []);
        H.modalPrompt({
          title: t('intl.adjust'),
          fields: [
            { type: 'select', name: 'correctedImportance', label: t('intl.importance'), options: [{ value: '', label: t('intl.keep') }, { value: 'HIGH', label: t('intl.high') }, { value: 'MEDIUM', label: t('intl.medium') }, { value: 'LOW', label: t('intl.low') }] },
            { type: 'select', name: 'correctedUrgency', label: t('intl.urgency'), options: [{ value: '', label: t('intl.keep') }, { value: 'HIGH', label: t('intl.high') }, { value: 'MEDIUM', label: t('intl.medium') }, { value: 'LOW', label: t('intl.low') }] },
            { type: 'select', name: 'correctedProjectId', label: t('intl.project'), options: [{ value: '', label: t('intl.keep') }].concat(projects.map((p) => ({ value: String(p.id), label: p.name }))) },
          ],
          okText: t('common.save'),
          onOk: async (v) => {
            const body = { verdict: 'partial' };
            if (v.correctedImportance) body.correctedImportance = v.correctedImportance;
            if (v.correctedUrgency) body.correctedUrgency = v.correctedUrgency;
            if (v.correctedProjectId) body.correctedProjectId = Number(v.correctedProjectId);
            await H.api('POST', `/api/analyses/${analysisId}/feedback`, body);
            location.reload();
          },
        });
      },
    };
  </script>
</body>
</html>
