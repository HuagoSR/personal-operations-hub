<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversations</title>
  <script>(function(){try{var t=localStorage.getItem('hub-theme')||'auto';if(t==='auto')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-bs-theme',t);var l=null;var m=location.search.match(/[?&]lang=(zh|en)\b/);if(m){l=m[1];try{localStorage.setItem('hub-lang',l);}catch(e2){}}else{try{l=localStorage.getItem('hub-lang');}catch(e2){}}document.documentElement.lang=(l==='en')?'en':'zh-CN';}catch(e){}})();</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2324292f'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-size='16' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link href="/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4 data-i18n="title.conversations">会话</h4>
    <form class="row g-2 mb-3" onsubmit="return createConv(event)">
      <div class="col-8"><input class="form-control" name="title" data-i18n-ph="proj.convTitlePh" placeholder="新会话标题"></div>
      <div class="col-4"><button class="btn btn-primary w-100" data-i18n="proj.createConversation">创建会话</button></div>
    </form>
    <div id="list"></div>
  </div>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
  <script>
    window.hub.page(t('title.conversations'), 'conversations');
    (async () => {
      const box = document.getElementById('list');
      box.innerHTML = window.hub.skeletonList();
      const rows = await window.hub.api('GET', '/api/conversations');
      document.getElementById('list').innerHTML = rows.map((c) => `
        <div class="card">
          <div class="card-body">
            <a href="/conversation.html?id=${c.id}"><strong>${window.hub.esc(c.title || 'Conversation #' + c.id)}</strong></a>
            <span class="tag ms-2">${window.hub.esc(c.kind)}</span>
          </div>
        </div>`).join('') || window.hub.emptyHtml('conversations', t('proj.noConversations'));
      window.createConv = async (ev) => {
        ev.preventDefault();
        const btn = ev.target.querySelector('button');
        try {
          await window.hub.withButton(btn, () => window.hub.api('POST', '/api/conversations', { title: ev.target.title.value || null }));
          location.reload();
        } catch (e) { window.hub.formError(e); }
        return false;
      };
    })().catch(window.hub.formError);
  </script>
</body>
</html>
