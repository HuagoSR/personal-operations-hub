<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversations</title>
  <link href="/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4>Conversations</h4>
    <form class="row g-2 mb-3" onsubmit="return createConv(event)">
      <div class="col-8"><input class="form-control" name="title" placeholder="新会话标题"></div>
      <div class="col-4"><button class="btn btn-primary w-100">创建会话</button></div>
    </form>
    <div id="list"></div>
  </div>
  <script src="/app.js"></script>
  <script>
    window.hub.page('Conversations', 'conversations');
    (async () => {
      const rows = await window.hub.api('GET', '/api/conversations');
      document.getElementById('list').innerHTML = rows.map((c) => `
        <div class="card">
          <div class="card-body">
            <a href="/conversation.html?id=${c.id}"><strong>${window.hub.esc(c.title || 'Conversation #' + c.id)}</strong></a>
            <span class="badge bg-secondary ms-2">${window.hub.esc(c.kind)}</span>
          </div>
        </div>`).join('') || '<div class="text-muted">暂无会话</div>';
      window.createConv = async (ev) => {
        ev.preventDefault();
        try {
          await window.hub.api('POST', '/api/conversations', { title: ev.target.title.value || null });
          location.reload();
        } catch (e) { window.hub.formError(e); }
        return false;
      };
    })().catch(window.hub.formError);
  </script>
</body>
</html>
