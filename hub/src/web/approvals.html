<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Approvals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4>Approvals</h4>
    <div id="list"></div>
  </div>
  <script src="/app.js"></script>
  <script>
    window.hub.page('Approvals');
    (async () => {
      const rows = await window.hub.api('GET', '/api/approvals');
      const cands = await window.hub.api('GET', '/api/candidates');
      const byId = Object.fromEntries(cands.map((c) => [c.id, c]));
      document.getElementById('list').innerHTML = rows.map((a) => {
        const c = byId[a.candidate_id] || {};
        return `
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between">
              <div>
                <strong>Approval #${a.id}</strong> ${window.hub.badge(a.state)}
                <span class="text-muted small">${window.hub.esc(a.approval_type)}</span>
                ${a.expires_at ? `<span class="text-muted small">过期于 ${window.hub.esc(a.expires_at)}</span>` : ''}
                ${c.title ? `<div class="mt-1">${window.hub.esc(c.title)} <span class="badge bg-secondary">${window.hub.esc(c.origin_type)}</span></div>` : ''}
              </div>
              <div>
                ${a.state === 'PENDING' && c.state === 'OPEN' ? `
                  <button class="btn btn-sm btn-success" onclick="window.hub.openApproveModal(${a.candidate_id}, '${window.hub.esc(c.title || '').replace(/'/g, "\\'")}')">批准</button>
                  <button class="btn btn-sm btn-danger" onclick="rej(${a.candidate_id})">拒绝</button>` : ''}
              </div>
            </div>
          </div>
        </div>`;
      }).join('') || '<div class="text-muted">暂无审批记录</div>';
      window.rej = async (candidateId) => {
        const reason = prompt('拒绝原因（可留空）');
        if (reason === null) return;
        try { await window.hub.api('POST', `/api/candidates/${candidateId}/reject`, { reason: reason || null }); location.reload(); }
        catch (e) { window.hub.formError(e); }
      };
    })().catch(window.hub.formError);
  </script>
</body>
</html>
