<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link href="/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4>Dashboard</h4>
    <div class="row" id="stats"></div>
    <h5 class="mt-3">Projects</h5>
    <div id="projects" class="row"></div>
    <h5 class="mt-3">Global Hub</h5>
    <div id="global"></div>
  </div>
  <script src="/app.js"></script>
  <script>
    window.hub.page('Dashboard');
    (async () => {
      const d = await window.hub.api('GET', '/api/dashboard');
      const boot = await window.hub.api('GET', '/api/bootstrap/status').catch(() => null);
      const cards = [
        ['Inbox 新事件', d.inbox, 'primary'],
        ['任务候选', d.candidates, 'info'],
        ['待审批', d.pendingApprovals, 'warning'],
        ['运行中执行', d.runningExecutions, 'primary'],
        ['等待用户', d.waitingForUser, 'warning'],
        ['结果待审', d.resultsAvailable, 'success'],
        ['已完成任务', d.completedTasks, 'success'],
        ['Outbox 待处理', d.outboxPending, 'secondary'],
        ['Outbox Dead', d.outboxDead, 'danger'],
      ];
      document.getElementById('stats').innerHTML = cards.map(([label, n, color]) =>
        `<div class="col-6 col-md-4 mb-3"><div class="stat-card bg-${color}"><div class="fs-4">${n}</div><div>${label}</div></div></div>`
      ).join('');
      document.getElementById('projects').innerHTML = d.projects.map((p) =>
        `<div class="col-6 col-md-3 mb-2"><a class="btn btn-outline-primary w-100" href="/project.html?id=${p.id}">${window.hub.esc(p.name)}${p.project_type === 'SYSTEM_HUB' ? ' <span class="badge bg-secondary">系统</span>' : ''}</a></div>`
      ).join('') || '<div class="text-muted">暂无项目</div>';
      document.getElementById('global').innerHTML = boot
        ? `<a class="btn btn-outline-dark" href="/conversation.html?id=${boot.globalConversation.id}">进入 Home（个人助手会话）</a>`
        : '<a class="btn btn-outline-dark" href="/conversations.html">进入 Conversations（含 Global Hub）</a>';
    })().catch(window.hub.formError);
  </script>
</body>
</html>
