<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <script>(function(){try{var t=localStorage.getItem('hub-theme')||'auto';if(t==='auto')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-bs-theme',t);var l=null;var m=location.search.match(/[?&]lang=(zh|en)\b/);if(m){l=m[1];try{localStorage.setItem('hub-lang',l);}catch(e2){}}else{try{l=localStorage.getItem('hub-lang');}catch(e2){}}document.documentElement.lang=(l==='en')?'en':'zh-CN';}catch(e){}})();</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2324292f'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-size='16' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link href="/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4 data-i18n="title.dashboard">概览</h4>
    <div class="row" id="stats"></div>
    <h5 class="mt-3" data-i18n="dash.projectActivity">项目活动</h5>
    <div id="project-activity" class="row"></div>
    <div class="row mt-3">
      <div class="col-md-6">
        <h5 data-i18n="dash.recent">最近活动</h5>
        <div id="recent"></div>
      </div>
      <div class="col-md-6">
        <h5 data-i18n="dash.projectsTitle">项目</h5>
        <div id="projects" class="row"></div>
        <h6 class="mt-3">Global Hub</h6>
        <div id="global"></div>
      </div>
    </div>
    <details class="mt-4">
      <summary class="text-muted" data-i18n="dash.devDetails">开发者详情（内部调试）</summary>
      <div id="devdetails" class="small mt-2"></div>
    </details>
  </div>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
  <script>
    window.hub.page(t('title.dashboard'));
    (async () => {
      const actBox = document.getElementById('project-activity');
      const recentBox = document.getElementById('recent');
      const projectsBox = document.getElementById('projects');
      actBox.innerHTML = window.hub.skeletonList(2);
      recentBox.innerHTML = window.hub.skeletonList(2);
      projectsBox.innerHTML = window.hub.skeletonList(2);
      const d = await window.hub.api('GET', '/api/dashboard');
      const boot = await window.hub.api('GET', '/api/bootstrap/status').catch(() => null);
      const cards = [
        ['inbox', 'dash.stats.inbox', d.inbox],
        ['tasks', 'dash.stats.candidates', d.candidates],
        ['bell', 'dash.stats.attention', d.attention],
        ['approvals', 'dash.stats.approvals', d.pendingApprovals],
        ['zap', 'dash.stats.running', d.runningExecutions],
        ['conversations', 'dash.stats.waiting', d.waitingForUser],
        ['results', 'dash.stats.results', d.resultsAvailable],
        ['checkCircle', 'dash.stats.completed', d.completedTasks],
        ['package', 'dash.stats.outbox', d.outboxPending],
        ['alertCircle', 'dash.stats.dead', d.outboxDead],
      ];
      document.getElementById('stats').innerHTML = cards.map(([ic, key, n]) =>
        `<div class="col-6 col-md-4 mb-2"><div class="stat-card"><div class="stat-icon">${window.hub.icon(ic, 17)}</div><div class="stat-num">${n}</div><div class="stat-label">${t(key)}</div></div></div>`
      ).join('');

      document.getElementById('project-activity').innerHTML = d.projectActivity.map((r) => {
        const name = r.project ? r.project.name : t('dash.countsGlobal');
        const href = r.project ? `/project.html?id=${r.project.id}` : null;
        const counts = Object.entries(r.taskCounts || {}).map(([s, c]) => `${i18n.statusLabel(s)} ${c}`).join(' · ');
        const inner = `<div class="col-12 col-md-6 mb-2"><div class="card h-100"><div class="card-body py-2">
          <strong>${window.hub.esc(name)}</strong> ${r.project && r.project.project_type === 'SYSTEM_HUB' ? `<span class="tag">${t('nav.tagSystem')}</span>` : ''}
          <div class="text-muted small">${counts ? window.hub.esc(counts) : t('dash.countsNone')}</div>
        </div></div></div>`;
        return href ? `<a href="${href}" class="text-decoration-none">${inner}</a>` : inner;
      }).join('') || window.hub.emptyHtml('folder', t('dash.noProjects'));

      document.getElementById('recent').innerHTML = (d.recentActivity || []).map((e) =>
        `<div class="small border rounded p-1 mb-1">${window.hub.esc(e.event_type)} · ${window.hub.esc(e.entity_type || '')}${e.entity_id ? ' #' + e.entity_id : ''} <span class="text-muted" title="${window.hub.esc(e.created_at)}">${window.hub.fmtTime(e.created_at)}</span></div>`
      ).join('') || window.hub.emptyHtml('clock', t('dash.noActivity'));

      document.getElementById('projects').innerHTML = d.projects.map((p) =>
        `<div class="col-6 col-md-6 mb-2"><a class="btn btn-outline-primary w-100" href="/project.html?id=${p.id}">${window.hub.esc(p.name)}${p.project_type === 'SYSTEM_HUB' ? ` <span class="tag">${t('nav.tagSystem')}</span>` : ''}</a></div>`
      ).join('') || window.hub.emptyHtml('folder', t('dash.noProjects'));
      document.getElementById('global').innerHTML = boot
        ? `<a class="btn btn-outline-dark" href="/conversation.html?id=${boot.globalConversation.id}">${t('dash.globalHub')}</a>`
        : `<a class="btn btn-outline-dark" href="/conversations.html">${t('dash.globalHubFallback')}</a>`;

      const devRows = [];
      if (boot) {
        devRows.push(`<div><span class="text-muted">Global Hub 会话</span> <code>#${boot.globalConversation.id}</code></div>`);
        devRows.push(`<div class="mt-1"><span class="text-muted">Hub 项目</span> <code>#${boot.hubProject.id}</code> <span class="text-muted">(${window.hub.esc(boot.hubProject.project_type)})</span></div>`);
        devRows.push(`<div class="mt-1"><span class="text-muted">General 会话</span> <code>#${boot.hubGeneralConversation.id}</code></div>`);
      }
      devRows.push(`<div class="mt-2"><span class="text-muted">${t('dash.outboxPending')}</span> <code>${d.outboxPending}</code> · <span class="text-muted">${t('dash.outboxDead')}</span> <code>${d.outboxDead}</code></div>`);
      document.getElementById('devdetails').innerHTML = devRows.join('');
    })().catch(window.hub.formError);
  </script>
</body>
</html>
