<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Executions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4>Executions</h4>
    <div id="list"></div>
  </div>
  <script src="/app.js"></script>
  <script>
    window.hub.page('Executions');
    (async () => {
      const rows = await window.hub.api('GET', '/api/executions');
      document.getElementById('list').innerHTML = rows.map((ex) => `
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between">
              <div>
                <span class="badge bg-dark">#${ex.id}</span>
                <strong>${window.hub.esc(ex.scenario)}</strong>
                <span class="text-muted small">task #${ex.task_id} / ${window.hub.esc(ex.worker)} / attempt ${ex.attempt}</span>
                ${window.hub.badge(ex.state)}
              </div>
              <div><a class="btn btn-sm btn-outline-primary" href="/tasks.html">在 Tasks 中操作</a></div>
            </div>
            ${ex.error ? `<div class="text-danger small">${window.hub.esc(ex.error)}</div>` : ''}
            ${ex.started_at ? `<div class="text-muted small">started ${window.hub.esc(ex.started_at)}${ex.finished_at ? ' · finished ' + window.hub.esc(ex.finished_at) : ''}</div>` : ''}
          </div>
        </div>`).join('') || '<div class="text-muted">暂无执行记录</div>';
    })().catch(window.hub.formError);
  </script>
</body>
</html>
