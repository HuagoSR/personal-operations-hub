<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){try{var t=localStorage.getItem('hub-theme')||'auto';if(t==='auto')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-bs-theme',t);var l=null;var m=location.search.match(/[?&]lang=(zh|en)\b/);if(m){l=m[1];try{localStorage.setItem('hub-lang',l);}catch(e2){}}else{try{l=localStorage.getItem('hub-lang');}catch(e2){}}document.documentElement.lang=(l==='en')?'en':'zh-CN';}catch(e){}})();</script>
  <title>Conversation</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2324292f'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-size='16' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link href="/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container d-flex flex-column" style="max-height:calc(100vh - 2rem)">
    <div class="d-flex justify-content-between align-items-center mt-2">
      <h4 id="title" class="mb-0">Conversation</h4>
      <div id="meta"></div>
    </div>
    <div id="timeline" class="conv-scroll flex-grow-1" style="min-height:300px"></div>
    <form class="composer mt-2" onsubmit="return sendComposer(event)">
      <textarea class="form-control" id="composer" rows="2" data-i18n-ph="conv.placeholder" placeholder="输入指令（Enter 发送生成任务候选；Shift+Enter 换行）"></textarea>
      <div class="composer-foot">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="plain-mode">
          <label class="form-check-label small text-muted" for="plain-mode" data-i18n="conv.recordOnly">仅记录为消息（不生成任务候选）</label>
        </div>
        <span class="spacer"></span>
        <button class="btn btn-primary btn-sm" data-i18n="common.send">发送</button>
      </div>
    </form>
  </div>
  <script src="/i18n.js"></script>
  <script src="/md.js"></script>
  <script src="/app.js"></script>
  <script>
    'use strict';
    const convId = new URLSearchParams(location.search).get('id');

    const H = window.hub;
    const box = () => document.getElementById('timeline');

    function messageItem(m) {
      const timeSpan = `<span title="${H.esc(m.created_at)}">${H.fmtTime(m.created_at)}</span>`;
      if (m.role === 'USER') {
        return `<div class="d-flex justify-content-end mb-2"><div class="msg-bubble msg-user" style="max-width:75%">
          <div class="small text-muted">${t('common.you')} · ${H.esc(m.kind)} · ${timeSpan}</div>
          ${mdLite(m.content)}
        </div></div>`;
      }
      if (m.role === 'WORKER') {
        return `<div class="d-flex justify-content-start mb-2"><div class="msg-bubble msg-worker" style="max-width:85%">
          <div class="small text-muted">Worker · ${timeSpan}</div>
          ${mdLite(m.content)}
        </div></div>`;
      }
      return `<div class="text-center mb-2"><div class="msg-bubble msg-system d-inline-block" style="max-width:85%">
        <div class="small text-muted">${H.esc(m.kind)} · ${timeSpan}</div>
        ${mdLite(m.content)}
      </div></div>`;
    }

    function taskItem(task) {
      const actions = [];
      if (!['COMPLETED', 'CANCELLED'].includes(task.state)) {
        actions.push(`<button class="btn btn-sm btn-outline-danger" onclick="window.hubConv.cancelTask(${task.id}, this)">${t('common.cancelTask')}</button>`);
      }
      if (['EXECUTING', 'RESULT_AVAILABLE', 'REVIEW'].includes(task.state)) {
        actions.push(`<button class="btn btn-sm btn-outline-primary" onclick="window.hubConv.anotherRun(${task.id})">${t('common.rerun')}</button>`);
      }
      return `<div class="card mb-2">
        <div class="card-head">
          ${H.typeChip('task')}<span class="chip">#${task.id}</span>
          <strong class="card-title">${H.esc(task.title)}</strong> ${H.badge(task.state)}
          <span class="spacer"></span>
        </div>
        ${actions.length ? `<div class="card-foot">${actions.join(' ')}</div>` : ''}
      </div>`;
    }

    function executionItem(e, questions, permissions) {
      const openQs = questions.filter((q) => q.execution_id === e.id && q.state === 'OPEN');
      const openPs = permissions.filter((p) => p.execution_id === e.id && p.state === 'OPEN');
      const hasBody = e.error || openQs.length || openPs.length;
      return `<div class="card mb-2">
        <div class="card-head">
          ${H.typeChip('execution')}<span class="chip">#${e.id}</span>
          <span class="card-meta">${H.esc(e.worker)} · ${H.esc(e.scenario)} · attempt ${e.attempt}</span>
          <span class="spacer"></span>
          ${H.badge(e.state)}
          ${e.started_at ? `<span class="card-meta" title="${H.esc(e.started_at)}">${H.fmtTime(e.started_at)}</span>` : ''}
        </div>
        ${hasBody ? `<div class="card-body">
          ${e.error ? `<div class="text-danger small mb-1">${H.esc(e.error)}</div>` : ''}
          ${openQs.map((q) => `
            <div class="inline-ask">
              ${H.typeChip('question')}
              <div class="mt-1">${mdLite(q.question)}</div>
              <form class="d-flex gap-1 mt-1" onsubmit="return window.hubConv.answer(event, ${e.id}, ${q.id})">
                <input class="form-control form-control-sm" name="a" placeholder="${t('common.answerPh')}">
                <button class="btn btn-sm btn-primary">${t('common.reply')}</button>
              </form>
            </div>`).join('')}
          ${openPs.map((p) => `
            <div class="inline-ask">
              ${H.typeChip('perm')} <span class="chip">${H.esc(p.capability)}</span>
              ${p.high_risk ? `<span class="badge b-danger"><i class="dot"></i>${t('common.highRisk')}</span>` : ''}
              <span class="spacer"></span>
              <button class="btn btn-sm btn-success" onclick="window.hubConv.perm(${e.id}, ${p.id}, 'allow', this)">${t('common.allow')}</button>
              <button class="btn btn-sm btn-danger" onclick="window.hubConv.perm(${e.id}, ${p.id}, 'deny', this)">${t('common.deny')}</button>
            </div>`).join('')}
        </div>` : ''}
      </div>`;
    }

    function resultItem(r, taskById) {
      const facts = r.facts_json ? JSON.parse(r.facts_json) : null;
      const task = taskById && taskById[r.task_id] ? taskById[r.task_id] : null;
      const confirmed = !!(task && task.state === 'COMPLETED');
      const actions = [];
      if (confirmed) {
        actions.push(`<button class="btn btn-sm btn-success" disabled>${H.icon('checkCircle', 13)}${t('common.done')}</button>`);
      } else {
        actions.push(`<button class="btn btn-sm btn-success" onclick="window.hubConv.complete(${r.id}, this)">${t('common.complete')}</button>`);
      }
      actions.push(`<button class="btn btn-sm btn-outline-primary" onclick="window.hubConv.anotherFromResult(${r.id})">${t('common.rerun')}</button>`);
      if (facts && facts.commitHash) {
        actions.push(`<button class="btn btn-sm btn-outline-dark" onclick="window.hubConv.prepareApply(${r.id}, this)">${t('common.prepareUpdate')}</button>`);
      }
      const diff = r.diff_json ? JSON.parse(r.diff_json) : null;
      const deployLine = facts && facts.commitHash
        ? `<div class="mt-1"><span class="fact">${t('conv.notApplied')}</span></div>` : '';
      return `<div class="card mb-2">
        <div class="card-head">
          ${H.typeChip('result')}<span class="chip">#${r.id}</span>
          <span class="card-meta">${t('common.taskWord')} #${r.task_id} · ${H.esc(r.worker)} · <span title="${H.esc(r.created_at)}">${H.fmtTime(r.created_at)}</span></span>
          <span class="spacer"></span>
        </div>
        <div class="card-body">
          ${H.factsHtml(facts)}
          ${deployLine}
          <div class="mt-1">${mdLite(r.summary)}</div>
          ${diff ? `<details class="fold"><summary>${t('common.viewDiff')}</summary><pre class="json">${H.esc(String(diff).slice(0, 20000))}</pre></details>` : ''}
        </div>
        <div class="card-foot">${actions.join(' ')}</div>
      </div>`;
    }

    function applyItem(ar) {
      const stat = ar.diff_stat_json ? JSON.parse(ar.diff_stat_json) : null;
      const files = ar.changed_files_json ? JSON.parse(ar.changed_files_json) : [];
      return `<div class="card mb-2">
        <div class="card-head">
          ${H.typeChip('apply')}
          ${H.badge(ar.state)}
          <span class="card-meta">apply #${ar.id} · ${t('common.taskWord')} #${ar.task_id}</span>
          <span class="spacer"></span>
        </div>
        <div class="card-body">
          ${ar.source_commit ? `<div class="small" style="margin-bottom:6px">${t('conv.sourceCommit')}: <code>${H.esc(String(ar.source_commit).slice(0, 12))}</code>${ar.base_commit ? ` · ${t('conv.base')} <code>${H.esc(String(ar.base_commit).slice(0, 12))}</code>` : ''}</div>` : ''}
          ${ar.commit_subject ? `<div class="small text-muted">${H.esc(ar.commit_subject)}</div>` : ''}
          ${stat ? `<div class="small">${stat.files} ${t('common.filesUnit')} +${stat.additions} -${stat.deletions}${files.length ? '：' + H.esc(files.map((f) => f.path).join('、').slice(0, 160)) : ''}</div>` : ''}
          ${ar.state === 'PREPARED' ? `<div class="small mt-1 text-muted">${t('conv.applyHint')}<code>bash ~/wechat-linux-research/hub/scripts/apply-hub.sh ${ar.id}</code></div>` : ''}
        </div>
      </div>`;
    }

    function approvalItem(a) {
      const c = a.candidate;
      if (!c || a.state !== 'PENDING') return '';
      return `<div class="card mb-2">
        <div class="card-head">
          <span class="badge b-warning"><i class="dot"></i>${t('conv.waitingApproval')}</span>
          <strong class="card-title">${H.esc(c.title)}</strong>
          <span class="card-meta">${t('common.candidate')} #${c.id}</span>
          <span class="spacer"></span>
        </div>
        ${c.description ? `<div class="card-body">${mdLite(c.description)}</div>` : ''}
        <div class="card-foot">
          <button class="btn btn-sm btn-danger" onclick="window.hubConv.reject(${c.id})">${t('common.reject')}</button>
          <button class="btn btn-sm btn-success" onclick="window.hub.openApproveModal(${c.id}, '${H.esc(c.title).replace(/'/g, "\\'")}')">${t('common.approve')}</button>
        </div>
      </div>`;
    }

    /* ---------- 渲染与智能刷新（diff：无变化跳过 / 纯新增追加 / 变化整段重渲染并保状态） ---------- */
    const RENDERED_TYPES = { message: 1, task: 1, execution: 1, result: 1, approval: 1, apply: 1 };
    let view = null; // { fams, itemKeys:Set, lastAt }

    function famSig(arr) {
      const m = new Map();
      (arr || []).forEach((x) => { if (x && x.id !== null && x.id !== undefined) m.set(String(x.id), JSON.stringify(x)); });
      return m;
    }
    function families(tl) {
      return {
        messages: famSig(tl.messages), tasks: famSig(tl.tasks), executions: famSig(tl.executions),
        results: famSig(tl.results), approvals: famSig(tl.approvals), candidates: famSig(tl.candidates),
        questions: famSig(tl.questions), permissions: famSig(tl.permissions), applyRequests: famSig(tl.applyRequests),
      };
    }
    function famsEqual(a, b) {
      const ka = Object.keys(a);
      if (ka.length !== Object.keys(b).length) return false;
      for (const k of ka) {
        const ma = a[k]; const mb = b[k];
        if (!mb || ma.size !== mb.size) return false;
        for (const [id, sig] of ma) if (mb.get(id) !== sig) return false;
      }
      return true;
    }
    /* 返回 'none'（完全一致）| 'added'（仅新增行，无删除无变化）| 'changed' */
    function classifyDiff(prev, cur) {
      let onlyAdd = true;
      let anyAdd = false;
      for (const key of Object.keys(prev)) {
        const pa = prev[key]; const ca = cur[key];
        if (!ca) return 'changed';
        if (pa.size > ca.size) return 'changed';
        for (const [id, sig] of pa) {
          if (!ca.has(id)) return 'changed';
          if (ca.get(id) !== sig) return 'changed';
        }
        if (ca.size > pa.size) anyAdd = true;
      }
      if (!anyAdd) return 'none';
      return onlyAdd ? 'added' : 'changed';
    }
    function itemKey(it) { return it.type + ':' + it.data.id; }
    function stickBottom() {
      const b = box();
      return b.scrollHeight - b.scrollTop - b.clientHeight < 60;
    }
    function scrollToBottom() { const b = box(); b.scrollTop = b.scrollHeight; }
    function renderItemsHtml(tl, items) {
      const taskById = Object.fromEntries(tl.tasks.map((task) => [task.id, task]));
      return items.map((it) => {
        if (it.type === 'message') return messageItem(it.data);
        if (it.type === 'task') return taskItem(it.data);
        if (it.type === 'execution') return executionItem(it.data, tl.questions, tl.permissions);
        if (it.type === 'result') return resultItem(it.data, taskById);
        if (it.type === 'approval') return approvalItem(it.data);
        if (it.type === 'apply') return applyItem(it.data);
        return '';
      }).join('');
    }
    function renderTimeline(tl) {
      const html = renderItemsHtml(tl, tl.items);
      box().innerHTML = html || H.emptyHtml('conversations', t('conv.empty'));
    }
    function captureDetails() {
      return Array.from(box().querySelectorAll('details.fold')).map((d) => d.open);
    }
    function restoreDetails(states) {
      const els = box().querySelectorAll('details.fold');
      els.forEach((d, i) => { if (states[i]) d.open = true; });
    }
    function fullRefresh(tl) {
      const b = box();
      const wasStick = stickBottom();
      const prevTop = b.scrollTop;
      const detailStates = captureDetails();
      renderTimeline(tl);
      restoreDetails(detailStates);
      if (wasStick) scrollToBottom(); else b.scrollTop = prevTop;
    }

    let loading = false;
    let rerunQueued = false;
    async function loadImpl() {
      const tl = await H.api('GET', `/api/conversations/${convId}/timeline`);
      const c = tl.conversation;
      const titleEl = document.getElementById('title');
      const newTitle = c.title || 'Conversation #' + c.id;
      if (titleEl.textContent !== newTitle) titleEl.textContent = newTitle;
      const meta = [];
      meta.push(`<span class="tag">${H.esc(c.kind)}</span>`);
      if (c.project_id) {
        meta.push(`<a class="small" href="/project.html?id=${c.project_id}">${t('conv.projectLink')} →</a>`);
      }
      const metaHtml = meta.join(' ');
      if (document.getElementById('meta').innerHTML !== metaHtml) document.getElementById('meta').innerHTML = metaHtml;

      const cur = families(tl);
      const keys = new Set(tl.items.map(itemKey));
      const lastAt = tl.items.length ? tl.items[tl.items.length - 1].at : '';
      if (!view) {
        renderTimeline(tl);
        view = { fams: cur, itemKeys: keys, lastAt };
        scrollToBottom();
        return;
      }
      const kind = classifyDiff(view.fams, cur);
      if (kind === 'none') return;

      if (kind === 'added') {
        /* 纯新增：检查是否全部落在时间线末尾，且未涉及嵌套渲染族（提问/权限/候选） */
        const additions = tl.items.filter((it) => !view.itemKeys.has(itemKey(it)));
        const nestedTouched = additions.some((it) => !RENDERED_TYPES[it.type]);
        const allAtEnd = additions.every((it) => it.at >= view.lastAt);
        const onlyMessageAdd = additions.length === cur.messages.size - view.fams.messages.size && additions.every((it) => it.type === 'message');
        if ((allAtEnd && !nestedTouched) || onlyMessageAdd) {
          const html = renderItemsHtml(tl, additions);
          if (html) {
            const wasStick = stickBottom();
            box().insertAdjacentHTML('beforeend', html);
            if (wasStick) scrollToBottom();
          }
          view = { fams: cur, itemKeys: keys, lastAt };
          return;
        }
      }
      fullRefresh(tl);
      view = { fams: cur, itemKeys: keys, lastAt };
    }

    async function load() {
      if (loading) { rerunQueued = true; return; }
      loading = true;
      try {
        await loadImpl();
      } finally {
        loading = false;
        if (rerunQueued) { rerunQueued = false; load(); }
      }
    }

    window.hubConv = {
      load,
      async cancelTask(id, btn) {
        try {
          await H.withButton(btn, () => H.api('POST', `/api/tasks/${id}/cancel`, {}));
          load();
        } catch (e) { H.formError(e); }
      },
      anotherRun(id) {
        H.modalPrompt({
          title: t('modal.chooseScenario'),
          fields: [{ type: 'select', name: 'scenario', options: H.SCENARIOS, value: 'SUCCESS' }],
          okText: t('common.confirm'),
          onOk: async (v) => {
            await H.api('POST', `/api/tasks/${id}/executions`, { scenario: v.scenario });
            load();
          },
        });
      },
      async answer(ev, exId, qId) {
        ev.preventDefault();
        const btn = ev.target.querySelector('button');
        try {
          await H.withButton(btn, () => H.api('POST', `/api/executions/${exId}/questions/${qId}/answer`, { answer: ev.target.elements.a.value }));
          load();
        } catch (e) { H.formError(e); }
        return false;
      },
      async perm(exId, pId, decision, btn) {
        try {
          await H.withButton(btn, () => H.api('POST', `/api/executions/${exId}/permissions/${pId}/decide`, { decision }));
          load();
        } catch (e) { H.formError(e); }
      },
      async complete(rId, btn) {
        try {
          await H.withButton(btn, () => H.api('POST', `/api/results/${rId}/review`, { action: 'complete' }));
          load();
        } catch (e) { H.formError(e); }
      },
      anotherFromResult(rId) {
        H.modalPrompt({
          title: t('modal.chooseScenario'),
          fields: [{ type: 'select', name: 'scenario', options: H.SCENARIOS, value: 'SUCCESS' }],
          okText: t('common.confirm'),
          onOk: async (v) => {
            await H.api('POST', `/api/results/${rId}/review`, { action: 'another_execution', scenario: v.scenario });
            load();
          },
        });
      },
      reject(cId) {
        H.modalPrompt({
          title: `${t('modal.rejectTitle')} #${cId}`,
          fields: [{ type: 'textarea', name: 'reason', placeholder: t('tasks.rejectPh') }],
          okText: t('common.reject'),
          okClass: 'btn-danger',
          onOk: async (v) => {
            await H.api('POST', `/api/candidates/${cId}/reject`, { reason: v.reason || null });
            load();
          },
        });
      },
      async prepareApply(rId, btn) {
        try {
          await H.withButton(btn, () => H.api('POST', `/api/results/${rId}/prepare-apply`, {}));
          load();
        } catch (e) { H.formError(e); }
      },
    };

    window.sendComposer = async (ev) => {
      ev.preventDefault();
      const box = document.getElementById('composer');
      const text = box.value.trim();
      if (!text) return false;
      const plain = document.getElementById('plain-mode').checked;
      const btn = ev.target.querySelector('button.btn');
      try {
        await H.withButton(btn, () => plain
          ? H.api('POST', `/api/conversations/${convId}/messages`, { text })
          : H.api('POST', '/api/user-commands', { text, conversationId: Number(convId) }));
        box.value = '';
        load();
      } catch (e) { H.formError(e); }
      return false;
    };

    (async () => {
      if (!convId) { document.getElementById('timeline').innerHTML = `<div class="text-danger">${t('conv.missingId')}</div>`; return; }
      document.getElementById('timeline').innerHTML = H.skeletonList(3);
      const boot = await H.api('GET', '/api/bootstrap/status').catch(() => null);
      const isHome = boot && String(boot.globalConversation.id) === String(convId);
      await H.page(t('title.conversation'), isHome ? 'home' : 'conversations', { noAutoReload: true });
      load();
      setInterval(() => {
        const el = document.activeElement;
        const typing = el && ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName);
        if (!typing && !document.body.classList.contains('modal-open')) load();
      }, 15000);
    })().catch(H.formError);
  </script>
</body>
</html>
