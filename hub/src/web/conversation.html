<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4 id="title">Conversation</h4>
    <div id="messages" style="max-height:60vh;overflow:auto"></div>
    <form class="mt-2" onsubmit="return sendCommand(event)">
      <div class="input-group">
        <input class="form-control" name="cmd" placeholder="输入 UserCommand（如：检查 gomoku-ai 的测试）→ 生成任务候选">
        <button class="btn btn-primary">发送为任务候选</button>
      </div>
    </form>
    <form class="mt-2" onsubmit="return sendMsg(event)">
      <div class="input-group">
        <input class="form-control" name="msg" placeholder="普通消息（仅记录，不生成任务）">
        <button class="btn btn-outline-secondary">发送消息</button>
      </div>
    </form>
  </div>
  <script src="/app.js"></script>
  <script>
    window.hub.page('Conversation');
    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      const d = await window.hub.api('GET', `/api/conversations/${id}/messages`);
      document.getElementById('title').textContent = d.conversation.title || 'Conversation #' + d.conversation.id;
      render(d.messages);
      async function render(msgs) {
        document.getElementById('messages').innerHTML = msgs.map((m) => {
          const roleClass = m.role === 'USER' ? 'msg-user' : (m.role === 'WORKER' ? 'msg-worker' : 'msg-system');
          return `<div class="msg-bubble ${roleClass}">
            <div class="small text-muted">${window.hub.esc(m.role)} · ${window.hub.esc(m.kind)} · ${window.hub.esc(m.created_at)}</div>
            <div>${window.hub.esc(m.content)}</div>
          </div>`;
        }).join('') || '<div class="text-muted">暂无消息</div>';
        const box = document.getElementById('messages');
        box.scrollTop = box.scrollHeight;
      }
      window.sendCommand = async (ev) => {
        ev.preventDefault();
        const text = ev.target.cmd.value.trim();
        if (!text) return false;
        try {
          const r = await window.hub.api('POST', '/api/user-commands', { text });
          ev.target.cmd.value = '';
          const d2 = await window.hub.api('GET', `/api/conversations/${id}/messages`);
          render(d2.messages);
          if (confirm('已创建任务候选 #' + r.candidateId + '。前往 Tasks 审批？')) location.href = '/tasks.html';
        } catch (e) { window.hub.formError(e); }
        return false;
      };
      window.sendMsg = async (ev) => {
        ev.preventDefault();
        const text = ev.target.msg.value.trim();
        if (!text) return false;
        try {
          await window.hub.api('POST', `/api/conversations/${id}/messages`, { text });
          ev.target.msg.value = '';
          const d2 = await window.hub.api('GET', `/api/conversations/${id}/messages`);
          render(d2.messages);
        } catch (e) { window.hub.formError(e); }
        return false;
      };
    })().catch(window.hub.formError);
  </script>
</body>
</html>
