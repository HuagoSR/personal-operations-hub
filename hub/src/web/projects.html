<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4>Projects</h4>
    <form class="row g-2 mb-3" onsubmit="return createProject(event)">
      <div class="col-4"><input class="form-control" name="name" placeholder="名称" required></div>
      <div class="col-4"><input class="form-control" name="description" placeholder="描述"></div>
      <div class="col-2"><input class="form-control" name="workspace" placeholder="workspace 路径（仅登记）"></div>
      <div class="col-2"><button class="btn btn-primary w-100">创建项目</button></div>
    </form>
    <div id="list"></div>
  </div>
  <script src="/app.js"></script>
  <script>
    window.hub.page('Projects');
    (async () => {
      const rows = await window.hub.api('GET', '/api/projects');
      document.getElementById('list').innerHTML = rows.map((p) => `
        <div class="card">
          <div class="card-body">
            <a href="/project.html?id=${p.id}"><strong>${window.hub.esc(p.name)}</strong></a>
            <span class="text-muted small ms-2">#${p.id}</span>
            ${p.description ? `<div class="text-muted small">${window.hub.esc(p.description)}</div>` : ''}
            ${p.workspace_path ? `<div class="text-muted small">workspace: ${window.hub.esc(p.workspace_path)}（仅登记元数据，Hub 不访问）</div>` : ''}
          </div>
        </div>`).join('') || '<div class="text-muted">暂无项目</div>';
      window.createProject = async (ev) => {
        ev.preventDefault();
        const f = ev.target;
        try {
          await window.hub.api('POST', '/api/projects', {
            name: f.name.value,
            description: f.description.value || null,
            workspacePath: f.workspace.value || null,
          });
          location.reload();
        } catch (e) { window.hub.formError(e); }
        return false;
      };
    })().catch(window.hub.formError);
  </script>
</body>
</html>
