<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4>Result Review</h4>
    <div id="list"></div>
  </div>
  <script src="/app.js"></script>
  <script>
    window.hub.page('Results');
    (async () => {
      const rows = await window.hub.api('GET', '/api/results');
      const tasks = await window.hub.api('GET', '/api/tasks');
      const tById = Object.fromEntries(tasks.map((t) => [t.id, t]));
      document.getElementById('list').innerHTML = rows.map((r) => {
        const t = tById[r.task_id] || {};
        return `
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between">
              <div>
                <span class="badge bg-dark">Result #${r.id}</span>
                <span class="text-muted small">task #${r.task_id} / ${window.hub.esc(r.worker)} / ${window.hub.esc(r.created_at)}</span>
              </div>
              <div>
                ${['RESULT_AVAILABLE', 'REVIEW'].includes(t.state) ? `
                  <button class="btn btn-sm btn-success" onclick="complete(${r.id})">确认完成</button>
                  <button class="btn btn-sm btn-outline-primary" onclick="another(${r.id})">再次执行</button>` : window.hub.badge(t.state || '?')}
              </div>
            </div>
            <div class="mt-2"><strong>${window.hub.esc(t.title || r.summary)}</strong></div>
            <div class="text-muted small">${window.hub.esc(r.summary)}</div>
            ${r.tests_json ? `<div class="small mt-1">Tests: <pre class="json">${window.hub.esc(JSON.stringify(JSON.parse(r.tests_json), null, 2))}</pre></div>` : ''}
            ${r.artifacts_json ? `<div class="small mt-1">Artifacts: <pre class="json">${window.hub.esc(JSON.stringify(JSON.parse(r.artifacts_json), null, 2))}</pre></div>` : ''}
            ${r.evidence_json ? `<div class="small mt-1">Evidence: <pre class="json">${window.hub.esc(JSON.stringify(JSON.parse(r.evidence_json), null, 2))}</pre></div>` : ''}
          </div>
        </div>`;
      }).join('') || '<div class="text-muted">暂无结果</div>';
      window.complete = async (id) => {
        try { await window.hub.api('POST', `/api/results/${id}/review`, { action: 'complete' }); location.reload(); }
        catch (e) { window.hub.formError(e); }
      };
      window.another = async (id) => {
        const scenario = prompt('场景', 'SUCCESS');
        if (scenario === null) return;
        try { await window.hub.api('POST', `/api/results/${id}/review`, { action: 'another_execution', scenario }); location.reload(); }
        catch (e) { window.hub.formError(e); }
      };
    })().catch(window.hub.formError);
  </script>
</body>
</html>
