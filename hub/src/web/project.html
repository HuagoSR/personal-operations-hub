<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project</title>
  <link href="/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4 id="title">Project</h4>
    <div id="meta" class="text-muted small mb-3"></div>
    <div class="d-flex justify-content-between align-items-center mt-2">
      <h5 class="mb-0">Conversations</h5>
      <button class="btn btn-sm btn-outline-primary" onclick="toggleConvForm()">+ 新建会话</button>
    </div>
    <form id="conv-form" class="row g-2 mt-2 mb-3" style="display:none" onsubmit="return createConv(event)">
      <div class="col-8"><input class="form-control form-control-sm" name="title" placeholder="会话标题"></div>
      <div class="col-4"><button class="btn btn-sm btn-primary w-100">创建</button></div>
    </form>
    <div id="conversations"></div>
    <h5 class="mt-4">Tasks</h5>
    <div id="tasks"></div>
    <details class="mt-4">
      <summary class="text-muted">Events（审计视图）</summary>
      <div id="events"></div>
    </details>
  </div>
  <script src="/app.js"></script>
  <script>
    window.hub.page('Project', 'projects');
    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      const d = await window.hub.api('GET', '/api/projects/' + id);
      const p = d.project;
      const isHub = p.project_type === 'SYSTEM_HUB';
      document.getElementById('title').innerHTML =
        `${window.hub.esc(p.name)} ${isHub ? '<span class="badge bg-dark">系统项目</span>' : ''}`;
      document.getElementById('meta').innerHTML = [
        p.description ? window.hub.esc(p.description) : '',
        `#${p.id} · ${window.hub.esc(p.state)}`,
        p.workspace_path ? `workspace: ${window.hub.esc(p.workspace_path)}（仅登记元数据，Hub 不访问）` : '',
      ].filter(Boolean).join(' · ');
      document.getElementById('conversations').innerHTML = d.conversations.map((c) => `
        <div class="card">
          <div class="card-body py-2">
            <a href="/conversation.html?id=${c.id}"><strong>${window.hub.esc(c.title || 'Conversation #' + c.id)}</strong></a>
            ${c.is_default ? '<span class="badge bg-secondary ms-1">默认</span>' : ''}
            <span class="text-muted small ms-2">#${c.id}</span>
          </div>
        </div>`).join('') || '<div class="text-muted">暂无会话</div>';
      document.getElementById('tasks').innerHTML = d.tasks.map((t) => `
        <div class="card">
          <div class="card-body py-2">
            <div class="d-flex justify-content-between">
              <div>
                ${t.conversation_id
                  ? `<a href="/conversation.html?id=${t.conversation_id}"><strong>#${t.id} ${window.hub.esc(t.title)}</strong></a>`
                  : `<strong>#${t.id} ${window.hub.esc(t.title)}</strong>`}
                ${window.hub.badge(t.state)}
              </div>
              <a class="btn btn-sm btn-outline-secondary" href="/results.html">查看结果</a>
            </div>
          </div>
        </div>`).join('') || '<div class="text-muted">暂无任务</div>';
      document.getElementById('events').innerHTML = d.events.map((e) =>
        `<div class="small border rounded p-1 mb-1">#${e.id} ${window.hub.esc(e.event_type)} ${window.hub.esc(e.created_at)}</div>`
      ).join('') || '<div class="text-muted">暂无事件</div>';
      window.toggleConvForm = () => {
        const f = document.getElementById('conv-form');
        f.style.display = f.style.display === 'none' ? 'flex' : 'none';
      };
      window.createConv = async (ev) => {
        ev.preventDefault();
        try {
          await window.hub.api('POST', '/api/conversations', {
            title: ev.target.title.value || null,
            projectId: Number(id),
          });
          location.reload();
        } catch (e) { window.hub.formError(e); }
        return false;
      };
    })().catch(window.hub.formError);
  </script>
</body>
</html>
