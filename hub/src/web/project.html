<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4 id="title">Project</h4>
    <h5 class="mt-3">Conversations</h5>
    <div id="conversations"></div>
    <h5 class="mt-3">Tasks</h5>
    <div id="tasks"></div>
    <h5 class="mt-3">Events</h5>
    <div id="events"></div>
  </div>
  <script src="/app.js"></script>
  <script>
    window.hub.page('Project');
    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      const d = await window.hub.api('GET', '/api/projects/' + id);
      document.getElementById('title').textContent = 'Project: ' + d.project.name;
      document.getElementById('conversations').innerHTML = d.conversations.map((c) =>
        `<a class="btn btn-outline-primary btn-sm me-1 mb-1" href="/conversation.html?id=${c.id}">${window.hub.esc(c.title || 'Conversation #' + c.id)}</a>`
      ).join('') || '<div class="text-muted">暂无会话</div>';
      document.getElementById('tasks').innerHTML = d.tasks.map((t) =>
        `<span class="badge bg-secondary me-1">Task #${t.id} ${window.hub.esc(t.title)}</span>${window.hub.badge(t.state)}<br>`
      ).join('') || '<div class="text-muted">暂无任务</div>';
      document.getElementById('events').innerHTML = d.events.map((e) =>
        `<div class="small border rounded p-1 mb-1">#${e.id} ${window.hub.esc(e.event_type)} ${window.hub.badge(e.priority_hint)} ${window.hub.esc(e.created_at)}</div>`
      ).join('') || '<div class="text-muted">暂无事件</div>';
    })().catch(window.hub.formError);
  </script>
</body>
</html>
