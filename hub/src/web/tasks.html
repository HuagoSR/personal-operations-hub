<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <script>(function(){try{var t=localStorage.getItem('hub-theme')||'auto';if(t==='auto')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-bs-theme',t);var l=null;var m=location.search.match(/[?&]lang=(zh|en)\b/);if(m){l=m[1];try{localStorage.setItem('hub-lang',l);}catch(e2){}}else{try{l=localStorage.getItem('hub-lang');}catch(e2){}}document.documentElement.lang=(l==='en')?'en':'zh-CN';}catch(e){}})();</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2324292f'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-size='16' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link href="/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h4 data-i18n="tasks.candidates">任务候选</h4>
    <div id="candidates"></div>
    <div class="d-flex justify-content-between align-items-center mt-4">
      <h4 class="mb-0" data-i18n="tasks.sectionTasks">任务</h4>
      <div>
        <div class="tabs" id="bucket-tabs">
          <button class="tab active" data-bucket="running"></button>
          <button class="tab" data-bucket="waitingForMe"></button>
          <button class="tab" data-bucket="resultAvailable"></button>
          <button class="tab" data-bucket="failed"></button>
          <button class="tab" data-bucket="completed"></button>
          <button class="tab" data-bucket="cancelled"></button>
        </div>
      </div>
    </div>
    <div id="buckets" class="mt-2"></div>
  </div>
  <script src="/i18n.js"></script>
  <script src="/md.js"></script>
  <script src="/app.js"></script>
  <script>
    window.hub.page(t('title.tasks'), 'tasks');
    (async () => {
      const bucketTabs = { running: 'tasks.bucket.running', waitingForMe: 'tasks.bucket.waiting', resultAvailable: 'tasks.bucket.results', failed: 'tasks.bucket.failed', completed: 'tasks.bucket.completed', cancelled: 'tasks.bucket.cancelled' };
      document.querySelectorAll('#bucket-tabs .tab').forEach((b) => { b.textContent = t(bucketTabs[b.dataset.bucket]); });

      const candBox = document.getElementById('candidates');
      const bucketBox = document.getElementById('buckets');
      candBox.innerHTML = window.hub.skeletonList(2);
      bucketBox.innerHTML = window.hub.skeletonList(2);
      const [cands, buckets] = await Promise.all([
        window.hub.api('GET', '/api/candidates'),
        window.hub.api('GET', '/api/tasks/buckets'),
      ]);
      document.getElementById('candidates').innerHTML = cands.map((c) => `
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between">
              <div><strong>${window.hub.esc(c.title)}</strong>
                <span class="tag">${window.hub.esc(c.origin_type)}</span>
                ${window.hub.badge(c.state)} <span class="text-muted small">#${c.id}</span>
              </div>
              <div>
                ${c.state === 'OPEN' ? `
                  <button class="btn btn-sm btn-success" onclick="window.hub.openApproveModal(${c.id}, '${window.hub.esc(c.title).replace(/'/g, "\\'")}')">${t('common.approve')}</button>
                  <button class="btn btn-sm btn-danger" onclick="reject(${c.id})">${t('common.reject')}</button>` : ''}
              </div>
            </div>
            ${c.description ? `<div class="text-muted small mt-1">${window.mdLite(c.description)}</div>` : ''}
          </div>
        </div>`).join('') || window.hub.emptyHtml('tasks', t('tasks.noCandidates'));

      const bucketMeta = {
        running: { label: 'tasks.bucket.running', empty: 'tasks.empty.running' },
        waitingForMe: { label: 'tasks.bucket.waiting', empty: 'tasks.empty.waiting' },
        resultAvailable: { label: 'tasks.bucket.results', empty: 'tasks.empty.results' },
        failed: { label: 'tasks.bucket.failed', empty: 'tasks.empty.failed' },
        completed: { label: 'tasks.bucket.completed', empty: 'tasks.empty.completed' },
        cancelled: { label: 'tasks.bucket.cancelled', empty: 'tasks.empty.cancelled' },
      };
      const taskCard = (entry) => {
        const task = entry.task;
        const ex = entry.latestExecution;
        const actions = [];
        if (!['COMPLETED', 'CANCELLED'].includes(task.state)) {
          actions.push(`<button class="btn btn-sm btn-outline-danger" onclick="cancelTask(${task.id}, this)">${t('common.cancelTask')}</button>`);
        }
        if (['EXECUTING', 'RESULT_AVAILABLE', 'REVIEW'].includes(task.state) || (ex && ex.state === 'FAILED')) {
          actions.push(`<button class="btn btn-sm btn-outline-primary" onclick="another(${task.id})">${t('common.rerun')}</button>`);
        }
        const exLine = ex ? `<span class="card-meta">${t('common.latestExec')} #${ex.id} ${window.hub.esc(ex.worker)} ${window.hub.badge(ex.state)}${ex.error ? ' · ' + window.hub.esc(String(ex.error).slice(0, 120)) : ''}</span>` : '';
        const convLink = task.conversation_id ? `<a class="small ms-2" href="/conversation.html?id=${task.conversation_id}">${t('common.conversation')} →</a>` : '';
        return `<div class="card">
          <div class="card-head">
            ${window.hub.typeChip('task')}<span class="chip">#${task.id}</span>
            <strong class="card-title">${window.hub.esc(task.title)}</strong> ${window.hub.badge(task.state)}
            ${convLink}
            <span class="spacer"></span>
          </div>
          <div class="card-body">${exLine}</div>
          ${actions.length ? `<div class="card-foot">${actions.join(' ')}</div>` : ''}
        </div>`;
      };
      let html = '';
      for (const [key, meta] of Object.entries(bucketMeta)) {
        const list = buckets[key] || [];
        html += `<div class="bucket-section" data-section="${key}" style="display:none">
          <div class="text-muted small mb-2">${t(meta.label)}（${list.length}）</div>
          ${list.map(taskCard).join('') || window.hub.emptyCenter(t(meta.empty))}
        </div>`;
      }
      document.getElementById('buckets').innerHTML = html;
      const showBucket = (key) => {
        document.querySelectorAll('#buckets .bucket-section').forEach((el) => {
          el.style.display = el.dataset.section === key ? 'block' : 'none';
        });
        document.querySelectorAll('#bucket-tabs .tab').forEach((b) => {
          b.classList.toggle('active', b.dataset.bucket === key);
        });
      };
      document.querySelectorAll('#bucket-tabs .tab').forEach((b) => {
        b.onclick = () => {
          showBucket(b.dataset.bucket);
          window.hub.saveUiValue('tasksBucket', b.dataset.bucket);
        };
      });
      const savedBucket = window.hub.readUiValue('tasksBucket');
      showBucket(bucketMeta[savedBucket] ? savedBucket : 'running');

      window.reject = (id) => {
        window.hub.modalPrompt({
          title: `${t('modal.rejectTitle')} #${id}`,
          fields: [{ type: 'textarea', name: 'reason', placeholder: t('tasks.rejectPh') }],
          okText: t('common.reject'),
          okClass: 'btn-danger',
          onOk: async (v) => {
            await window.hub.api('POST', `/api/candidates/${id}/reject`, { reason: v.reason || null });
            location.reload();
          },
        });
      };
      window.cancelTask = async (id, btn) => {
        try {
          await window.hub.withButton(btn, () => window.hub.api('POST', `/api/tasks/${id}/cancel`, {}));
          location.reload();
        } catch (e) { window.hub.formError(e); }
      };
      window.another = (id) => {
        window.hub.modalPrompt({
          title: t('modal.chooseScenario'),
          fields: [{ type: 'select', name: 'scenario', options: window.hub.SCENARIOS, value: 'SUCCESS' }],
          okText: t('common.confirm'),
          onOk: async (v) => {
            await window.hub.api('POST', `/api/tasks/${id}/executions`, { scenario: v.scenario });
            location.reload();
          },
        });
      };
    })().catch(window.hub.formError);
  </script>
</body>
</html>
